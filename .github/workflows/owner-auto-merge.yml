name: Owner auto-merge

on:
  status:
  check_run:
    types: [completed]
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - name: Merge eligible PRs after successful checks
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh pr list --state open --base main --author Asplitline --limit 100 \
            --json number,isDraft,headRefOid,isCrossRepository,author |
          jq -r '.[] | select(.isDraft == false and .isCrossRepository == false and .author.login == "Asplitline") | [.number,.headRefOid] | @tsv' |
          while IFS=$'\t' read -r number sha; do
            statuses=$(gh api "repos/$GH_REPO/commits/$sha/status")
            if ! jq -e '.state == "success" and any(.statuses[]; .context == "Vercel" and .state == "success")' <<< "$statuses" >/dev/null; then
              continue
            fi
            checks=$(gh api --paginate "repos/$GH_REPO/commits/$sha/check-runs?filter=latest&per_page=100" --jq '.check_runs[] | {status,conclusion}')
            if ! jq -es 'all(.[]; .status == "completed" and (.conclusion == "success" or .conclusion == "neutral" or .conclusion == "skipped"))' <<< "$checks" >/dev/null; then
              continue
            fi
            gh pr merge "$number" --auto --squash --match-head-commit "$sha"
          done
